
<svg width="1100" height="300" viewBox="0 0 1100 300"
     fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="cardBg"
      x1="0" y1="0" x2="1100" y2="300"
      gradientUnits="userSpaceOnUse">
      <stop stop-color="#111B2B"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect x="6" y="6" width="1088" height="288"
        rx="20"
        fill="url(#cardBg)"
        stroke="#304157"
        stroke-width="1.5"/>

  <!-- Blog Name -->
  <text x="42" y="68"
        fill="#94A3B8"
        font-size="24"
        font-weight="600"
        font-family="Segoe UI, Arial, sans-serif">
    hittol.github.io
  </text>

  <!-- External Link Icon -->
  <g transform="translate(1010 39)"
     stroke="#94A3B8"
     stroke-width="3"
     stroke-linecap="round"
     stroke-linejoin="round"
     fill="none">

    <!-- External link box -->
    <path d="M21 10 H10 C6 10 5 12 5 15 V33 C5 37 7 39 11 39 H30 C34 39 36 37 36 33 V22"/>

    <!-- Arrow -->
    <path d="M23 5 H41 V23"/>
    <path d="M41 5 L21 25"/>
  </g>

  <!-- Post Title -->
  <text x="42" y="138"
        fill="#FFFFFF"
        font-size="26"
        font-weight="700"
        font-family="Segoe UI, Arial, sans-serif">
    [Azure] Azure VPN 개념 및 문제진단
  </text>

  <!-- Description -->
  <text x="42" y="198"
        fill="#AEBFD4"
        font-size="22"
        font-weight="400"
        font-family="Segoe UI, Arial, sans-serif">
    Azure VPN 개념 및 배포, 문제진단에 대한 블로그 포스트
  </text>

  <!-- Tags -->
  <g>
    <rect x="42" y="228" width="100" height="38"
          rx="19" fill="#0F1A28"
          stroke="#304157" stroke-width="2"/>
    <text x="92" y="253"
          text-anchor="middle"
          fill="#35D0A3"
          font-size="19"
          font-family="Segoe UI, Arial, sans-serif">
      VPN
    </text>
  </g>

  <g>
    <rect x="158" y="228" width="108" height="38"
          rx="19" fill="#0F1A28"
          stroke="#304157" stroke-width="2"/>
    <text x="212" y="253"
          text-anchor="middle"
          fill="#35D0A3"
          font-size="19"
          font-family="Segoe UI, Arial, sans-serif">
      azure
    </text>
  </g>

  <g>
    <rect x="282" y="228" width="168" height="38"
          rx="19" fill="#0F1A28"
          stroke="#304157" stroke-width="2"/>
    <text x="366" y="253"
          text-anchor="middle"
          fill="#35D0A3"
          font-size="19"
          font-family="Segoe UI, Arial, sans-serif">
      Networking
    </text>
  </g>

</svg>
