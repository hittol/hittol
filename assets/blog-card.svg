<svg width="1100" height="240" viewBox="0 0 1100 240"
     fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="cardBg"
      x1="0" y1="0" x2="1100" y2="240"
      gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117"/>
      <stop offset="1" stop-color="#0E1520"/>
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect x="8" y="8" width="1084" height="224"
        rx="18"
        fill="url(#cardBg)"
        stroke="#263041"
        stroke-width="1.2"/>

  <!-- Blog Name -->
  <text x="42" y="56"
        fill="#8EA3BF"
        font-size="22"
        font-weight="600"
        font-family="Segoe UI, Arial, sans-serif">
    hittol.github.io
  </text>

  <!-- External Link Icon -->
  <g transform="translate(1010 28) scale(0.60)"
     stroke="#94A3B8"
     stroke-width="3"
     stroke-linecap="round"
     stroke-linejoin="round"
     fill="none">

    <!-- External link box -->
    <path d="M21 10 H10 C6 10 5 12 5 15 V33 C5 37 7 39 11 39 H30 C34 39 36 37 36 33 V22"/>

    <!-- Arrow -->
    <path d="M23 5 H41 V23"/>
    <path d="M41 5 L21 25"/>
  </g>

  <!-- Post Title -->
  <text x="42" y="108"
        fill="#FFFFFF"
        font-size="22"
        font-weight="700"
        font-family="Segoe UI, Arial, sans-serif">
    [Azure] Azure VPN 개념 및 문제진단
  </text>

  <!-- Description -->
  <text x="42" y="154"
        fill="#AEBFD4"
        font-size="17"
        font-weight="400"
        font-family="Segoe UI, Arial, sans-serif">
    Azure VPN 개념 및 배포, 문제진단에 대한 블로그 포스트
  </text>

  <!-- Tags -->
  <g>
    <rect x="42" y="182" width="84" height="30"
          rx="15" fill="#0D1117"
          stroke="#304157" stroke-width="1.6"/>
    <text x="84" y="202"
          text-anchor="middle"
          fill="#35D0A3"
          font-size="16"
          font-family="Segoe UI, Arial, sans-serif">
      VPN
    </text>
  </g>

  <g>
    <rect x="138" y="182" width="100" height="30"
          rx="15" fill="#0D1117"
          stroke="#304157" stroke-width="1.6"/>
    <text x="188" y="202"
          text-anchor="middle"
          fill="#35D0A3"
          font-size="16"
          font-family="Segoe UI, Arial, sans-serif">
      azure
    </text>
  </g>

  <g>
    <rect x="250" y="182" width="160" height="30"
          rx="15" fill="#0D1117"
          stroke="#304157" stroke-width="1.6"/>
    <text x="330" y="202"
          text-anchor="middle"
          fill="#35D0A3"
          font-size="16"
          font-family="Segoe UI, Arial, sans-serif">
      Networking
    </text>
  </g>

</svg>